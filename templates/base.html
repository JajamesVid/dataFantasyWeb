<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}DataFantasy{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <img src="{{ url_for('static', filename='img/DATAFANTASYFINALLOGO.png') }}" alt="DataFantasy" class="logo-img" />
        <span class="logo-text">Data <span class="accent">Fantasy</span></span>
      </a>
      <nav class="nav">
        <a href="/">Inicio</a>
        <a href="/equipos">Equipos</a>
        <a href="{{ url_for('admin_articles') }}" class="nav-admin">Admin</a>
      </nav>
    </div>
  </header>

  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
      <div class="container">
        {% for message in messages %}
        <div class="flash-message">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 DataFantasy · Análisis de La Liga Santander</p>
    </div>
  </footer>
</body>
</html>
